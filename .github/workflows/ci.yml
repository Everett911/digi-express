name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Installs Vite+, Node and the dependencies (vp install), with caching.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true

      # The type check needs the generated Prisma client. Generating doesn't
      # connect to a database, so no secrets are needed.
      - run: npx prisma generate

      - run: vp check
      - run: vp test run
